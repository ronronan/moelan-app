server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app uses hash-based routing (#/players/:id), so every real path
    # served by nginx is just "/" plus static assets — this fallback is
    # cheap insurance if that ever changes to path-based routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
