services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Only consulted when the "proxy" profile's traefik service is running.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moelan-keycloak.rule=Host(`${MOELAN_DOMAIN:-localhost}`) && (PathPrefix(`/realms`) || PathPrefix(`/resources`) || PathPrefix(`/admin`))"
      - "traefik.http.routers.moelan-keycloak.priority=10"
      - "traefik.http.services.moelan-keycloak.loadbalancer.server.port=8080"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/app
      BIND_ADDR: 0.0.0.0:8000
      # Must match the `iss` claim Keycloak puts in tokens, i.e. wherever
      # browsers actually reach it (KC_HOSTNAME below — set both from the
      # same value in .env, they're independent here only because one
      # sets Keycloak's own idea of its hostname and the other tells the
      # API what to expect, and Keycloak's KC_HOSTNAME doesn't accept a
      # port suffix the same way a URL does). The API container can't
      # resolve that hostname to the keycloak container itself, so it
      # fetches keys via KEYCLOAK_JWKS_URL (internal DNS) instead.
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://localhost:8080/realms/moelan}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/moelan
      KEYCLOAK_AUDIENCE: moelan-api
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-moelan}
      KEYCLOAK_SERVICE_CLIENT_ID: ${KEYCLOAK_SERVICE_CLIENT_ID:-moelan-api-service}
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:-}
      # Generic SMTP relay for debt-alert emails — works with Mailgun/
      # Brevo/SendGrid/etc, all of which expose one. Unset SMTP_HOST means
      # "don't send email" rather than an error, so the app runs fine
      # without a mail provider configured yet.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RUST_LOG: info
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moelan-api.rule=Host(`${MOELAN_DOMAIN:-localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.moelan-api.priority=10"
      - "traefik.http.services.moelan-api.loadbalancer.server.port=8000"

  web:
    build:
      context: .
      dockerfile: ./infra/web/Dockerfile
      args:
        API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
        KEYCLOAK_ISSUER_URL: ${PUBLIC_KEYCLOAK_ISSUER_URL:-http://localhost:8080/realms/moelan}
    ports:
      - "8090:80"
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moelan-web.rule=Host(`${MOELAN_DOMAIN:-localhost}`)"
      - "traefik.http.routers.moelan-web.priority=1"
      - "traefik.http.services.moelan-web.loadbalancer.server.port=80"

  # Optional: puts web/api/keycloak behind one hostname. Off by default
  # (`docker compose up` never starts it); enable with
  # `docker compose --profile proxy up`. See infra/traefik/traefik.yml and
  # README's "Production deployment" section before using this for a real
  # domain — KC_HOSTNAME and the PUBLIC_* build args need to agree with
  # MOELAN_DOMAIN once Traefik is the front door. Routing itself is defined
  # by the `traefik.http.*` labels on keycloak/api/web above, not here.
  traefik:
    image: traefik:v3.7
    profiles: ["proxy"]
    ports:
      - "${TRAEFIK_HTTP_PORT:-8888}:80"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - web
      - api
      - keycloak

volumes:
  pg_data:
